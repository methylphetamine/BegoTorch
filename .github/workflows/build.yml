name: Build BegoTorch APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Print Flutter / Dart versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Install zip tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip

      # Assemble the TWRP-flashable package. The component manifest
      # (config/begotorch.cml) is fused in here, so the flashed app already has
      # the torch capability and needs no su / Magisk / KernelSU at runtime.
      - name: Build TWRP-flashable zip
        run: |
          tools/make_twrp_zip.sh \
            --apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: begotorch-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload TWRP-flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: begotorch-flashable-zip
          path: dist/begotorch-flashable.zip
          if-no-files-found: error
