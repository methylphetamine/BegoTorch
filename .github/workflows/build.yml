name: Build TorchBridge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and flashable package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # The injector rewrites the platform SELinux policy, and a policy that does
      # not compile does not boot. This test runs on every push and covers
      # idempotency, fail-closed behaviour on an unsafe policy, byte-for-byte
      # revert, and that no permissive statement can appear in what is injected.
      # It is the only automated guard on the flash path.
      - name: Test the SELinux injector
        run: sh tools/cil_selftest.sh

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Stage APK for packaging
        run: gradle :app:stageTwrpApk --no-daemon

      - name: Install zip tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip

      - name: Build TWRP-flashable package
        run: |
          tools/make_twrp_zip.sh --apk app/build/outputs/twrp/torchbridge.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: torchbridge-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload TWRP-flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: torchbridge-flashable-zip
          path: dist/torchbridge-flashable.zip
          if-no-files-found: error

      - name: Upload TWRP uninstall zip
        uses: actions/upload-artifact@v4
        with:
          name: torchbridge-uninstall-zip
          path: dist/torchbridge-uninstall.zip
          if-no-files-found: error
